<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Read Students</title>
  <link rel="stylesheet" href="styles-read.css" />
</head>
<body>
  <a href="index.html" class="home-btn">Home</a>
  <div class="container">
    <h1>Search Students by Course</h1>
    <input type="text" id="searchCourse" placeholder="Enter course name (e.g. AI)" />
    <button onclick="searchByCourse()">Search</button>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Course</th>
        </tr>
      </thead>
      <tbody id="students-body">
        <!-- Results appear here -->
      </tbody>
    </table>
  </div>

  <script src="read.js"></script>
</body>
</html>
